# ============================================================================
#  Softlend Rule Engine - configuration
#
#  EVERY threshold and rule lives in this file. The Python code contains no
#  business numbers at all. To change a policy or add a rule, edit only this
#  file - no code changes, no redeploy of logic.
# ============================================================================

# ---------------------------------------------------------------------------
# Stage 1: gap rules. A rule "fires" when the customer has that problem.
# estimated_score_gain = points recoverable by fixing it.
# {current_value} in action_template is replaced with the real input value.
# ---------------------------------------------------------------------------
gap_rules:
  - id: high_utilisation
    field: credit_utilisation_pct
    operator: gt
    value: 30
    impact: high
    estimated_score_gain: 35
    action_template: "Reduce credit card utilisation from {current_value}% to below 30%"

  - id: missed_payments
    field: missed_payments_12m
    operator: gt
    value: 0
    impact: high
    estimated_score_gain: 25
    action_template: "Clear {current_value} overdue EMI(s) to remove the missed-payment flag"

  - id: written_off_account
    field: written_off_accounts
    operator: gt
    value: 0
    impact: high
    estimated_score_gain: 40
    action_template: "Settle {current_value} written-off account(s) with the lender"

  - id: short_credit_age
    field: credit_age_months
    operator: lt
    value: 36
    impact: medium
    estimated_score_gain: 10
    action_template: "Avoid closing old accounts - your oldest account is only {current_value} months old"

  - id: too_many_enquiries
    field: hard_enquiries_6m
    operator: gt
    value: 3
    impact: medium
    estimated_score_gain: 10
    action_template: "Avoid applying for new credit - you have {current_value} hard enquiries in 6 months"

# ---------------------------------------------------------------------------
# Stage 2: eligibility rules. Grouped, with per-group AND / OR logic.
# A customer is eligible only if every group is satisfied.
# ---------------------------------------------------------------------------
eligibility_rules:
  - name: standard_eligibility
    logic: AND
    rules:
      - id: age
        field: age
        operator: between
        min: 21
        max: 60
        message: "Age must be between 21 and 60"

      - id: cibil_score
        field: cibil_score
        operator: gte
        value: 650
        message: "CIBIL score must be at least 650"

      - id: foir
        field: foir
        operator: lte
        value: 0.5
        message: "FOIR (existing EMIs / income) must be 0.50 or below"

      - id: employment_type
        field: employment_type
        operator: in
        values: ["salaried", "self_employed"]
        message: "Employment type must be salaried or self-employed"

      - id: no_written_off_accounts
        field: written_off_accounts
        operator: eq
        value: 0
        message: "Customer must have no written-off accounts"

      - id: loan_amount_cap
        field: requested_amount
        operator: lte_multiplier
        multiplier_field: monthly_income
        multiplier: 10
        message: "Requested amount cannot exceed 10x monthly income"
